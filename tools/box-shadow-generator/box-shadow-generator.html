<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Shadow Generator | تولید سایه جعبه CSS</title>
        <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="box-shadow-generator.css" />
  </head>
  <body>
    <div class="container">
        <div class="lang-switcher">
      <label for="langSelect" data-i18n="langLabel">&#1586;&#1576;&#1575;&#1606;:</label>
      <select id="langSelect">
        <option value="fa">&#1601;&#1575;&#1585;&#1587;&#1740;</option>
        <option value="en">English</option>
        <option value="zh">&#20013;&#25991;</option>
        <option value="hi">&#2361;&#2367;&#2306;&#2342;&#2368;</option>
      </select>
    </div>

    <a class="back-link" href="../../index.html" data-i18n="backHome">Back to home</a>

      <h1 id="pageTitle" data-i18n="boxShadowPageTitle">🎭 Box Shadow Generator</h1>
      <div class="sub" id="pageSubtitle" data-i18n="boxShadowPageSubtitle">
        ایجاد سایه‌های چندلایه با تنظیمات کامل — خروجی CSS آماده
      </div>

      <div class="two-columns">
        <div class="col">
          <div class="preview-box">
            <div class="shadow-preview" id="previewBox"></div>
          </div>

          <div id="shadowsContainer"></div>
          <button id="addShadowBtn" class="add-shadow-btn">
            + افزودن سایه جدید
          </button>
        </div>

        <div class="col">
          <div class="code-area">
            <pre id="cssOutput">box-shadow: none;</pre>
            <button id="copyBtn" class="copy-btn">📋 کپی CSS</button>
          </div>
          <div style="margin-top: 1rem; font-size: 0.8rem; color: #aaa">
            💡 نکته: هر سایه می‌تواند افقی، عمودی، blur، spread، رنگ و حالت
            inset داشته باشد.
          </div>
        </div>
      </div>
      <footer>
        🔒 تمام عملیات در مرورگر شما انجام می‌شود — سایه‌ها در real-time بروز
        می‌شوند.
      </footer>
    </div>

    <script src="box-shadow-generator.js"></script>
    <script src="../../script.js"></script>
</body>
</html>
