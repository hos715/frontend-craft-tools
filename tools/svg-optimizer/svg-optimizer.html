<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Optimizer | بهینه‌ساز فایل‌های SVG</title>
        <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="svg-optimizer.css" />
  </head>
  <body>
    <div class="container">
        <div class="lang-switcher">
      <label for="langSelect" data-i18n="langLabel">&#1586;&#1576;&#1575;&#1606;:</label>
      <select id="langSelect">
        <option value="fa">&#1601;&#1575;&#1585;&#1587;&#1740;</option>
        <option value="en">English</option>
        <option value="zh">&#20013;&#25991;</option>
        <option value="hi">&#2361;&#2367;&#2306;&#2342;&#2368;</option>
      </select>
    </div>

    <a class="back-link" href="../../index.html" data-i18n="backHome">Back to home</a>

      <h1 id="pageTitle" data-i18n="svgOptimizerPageTitle">✨ SVG Optimizer</h1>
      <div class="sub" id="pageSubtitle" data-i18n="svgOptimizerPageSubtitle">
        بهینه‌سازی فایل‌های SVG — حذف کامنت، متادیتا، فاصله‌ها، گرد کردن اعداد
        و...
      </div>

      <div class="two-columns">
        <div class="col">
          <div class="upload-area" id="dropZone">
            <span data-i18n="svgUpload">📂 فایل SVG را بکشید یا کلیک کنید</span>
            <input
              type="file"
              id="fileInput"
              accept="image/svg+xml, .svg"
              style="display: none"
            />
          </div>
          <textarea
            id="inputSvg"
            data-i18n-placeholder="svgInputPlaceholder"
            placeholder="یا کد SVG را مستقیماً اینجا paste کنید..."
          ></textarea>
          <div class="options">
            <div class="option-row">
              <label
                ><input type="checkbox" id="optRemoveComments" checked />
                <span data-i18n="svgOptRemoveComments">حذف کامنت‌ها (<!-- ... -->)</span></label
              >
              <label
                ><input type="checkbox" id="optRemoveMetadata" checked />
                <span data-i18n="svgOptRemoveMetadata">حذف تگ‌های متادیتا (metadata, sodipodi, inkscape)</span></label
              >
              <label
                ><input type="checkbox" id="optMinifyWhitespace" checked />
                <span data-i18n="svgOptMinifyWhitespace">حذف فاصله‌ها و خطوط اضافی (minify)</span></label
              >
            </div>
            <div class="option-row">
              <label
                ><input type="checkbox" id="optRoundNumbers" checked />
                <span data-i18n="svgOptRoundNumbers">گرد کردن اعداد (۳ رقم اعشار)</span></label
              >
              <label
                ><input type="checkbox" id="optRemoveEmptyTags" checked />
                <span data-i18n="svgOptRemoveEmptyTags">حذف تگ‌های خالی</span></label
              >
              <label
                ><input type="checkbox" id="optRemoveDoctype" checked />
                <span data-i18n="svgOptRemoveDoctype">حذف DOCTYPE</span></label
              >
            </div>
          </div>
          <div class="flex-buttons">
            <button id="optimizeBtn" data-i18n="svgOptimizeBtn">⚡ بهینه‌سازی</button>
            <button id="copyOutputBtn" data-i18n="svgCopyOutputBtn">📋 کپی خروجی</button>
            <button id="downloadBtn" data-i18n="svgDownloadBtn">💾 دانلود SVG</button>
          </div>
        </div>

        <div class="col">
          <div class="result-area">
            <h3 data-i18n="svgOutputTitle">📄 خروجی بهینه‌شده</h3>
            <div class="stats" id="stats"></div>
            <pre id="outputSvg" dir="ltr"></pre>
          </div>
        </div>
      </div>
      <footer data-i18n="privacyFooterData">
        🔒 تمام عملیات در مرورگر شما انجام می‌شود — هیچ داده‌ای به سرور ارسال
        نمی‌شود.
      </footer>
    </div>

    <script src="../../translations.js"></script>
    <script src="../../script.js"></script>
    <script src="svg-optimizer.js"></script>
</body>
</html>
