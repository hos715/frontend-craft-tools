<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator | تولید کد QR</title>
        <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="qr-generator.css" />
    <!-- کتابخانه qrcode-generator (بدون وابستگی) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  </head>
  <body>
    <div class="container">
        <div class="lang-switcher">
      <label for="langSelect" data-i18n="langLabel">&#1586;&#1576;&#1575;&#1606;:</label>
      <select id="langSelect">
        <option value="fa">&#1601;&#1575;&#1585;&#1587;&#1740;</option>
        <option value="en">English</option>
        <option value="zh">&#20013;&#25991;</option>
        <option value="hi">&#2361;&#2367;&#2306;&#2342;&#2368;</option>
      </select>
    </div>

    <a class="back-link" href="../../index.html" data-i18n="backHome">Back to home</a>

      <h1 id="pageTitle" data-i18n="qrGeneratorPageTitle">📱 QR Code Generator</h1>
      <div class="sub" id="pageSubtitle" data-i18n="qrGeneratorPageSubtitle">تبدیل متن، لینک یا هر داده به کد QR قابل دانلود</div>

      <div class="form-group">
        <label data-i18n="qrTextLabel">📝 متن یا آدرس (URL)</label>
        <textarea
          id="qrText"
          data-i18n-placeholder="qrTextPlaceholder"
          placeholder="https://example.com یا هر متن دلخواه..."
        >
https://github.com</textarea
        >
      </div>

      <div class="row">
        <div class="form-group">
          <label data-i18n="qrSizeLabel">📏 اندازه (پیکسل)</label>
          <input
            type="range"
            id="qrSize"
            min="100"
            max="500"
            step="10"
            value="250"
          />
          <span id="sizeValue" style="margin-right: 8px">250px</span>
        </div>
        <div class="form-group">
          <label data-i18n="qrCorrectionLabel">🔧 سطح تصحیح خطا</label>
          <select id="qrCorrection">
            <option value="L" data-i18n="qrCorrectionL">L - کم (۷٪)</option>
            <option value="M" selected data-i18n="qrCorrectionM">M - متوسط (۱۵٪)</option>
            <option value="Q" data-i18n="qrCorrectionQ">Q - بالا (۲۵٪)</option>
            <option value="H" data-i18n="qrCorrectionH">H - خیلی بالا (۳۰٪)</option>
          </select>
        </div>
      </div>

      <button id="generateBtn" data-i18n="qrGenerateBtn">✨ تولید QR Code</button>

      <div class="preview-area" id="previewArea" style="display: none">
        <div class="qr-preview">
          <canvas id="qrCanvas"></canvas>
        </div>
        <button id="downloadBtn" class="download-btn" data-i18n="qrDownloadBtn">
          💾 دانلود به صورت PNG
        </button>
      </div>

      <div id="statusMsg" class="status"></div>
      <footer data-i18n="privacyFooterData">
        🔒 تمام عملیات در مرورگر شما انجام می‌شود — داده‌ها به هیچ سروری ارسال
        نمی‌شوند.
      </footer>
    </div>

    <script src="../../translations.js"></script>
    <script src="../../script.js"></script>
    <script src="qr-generator.js"></script>
</body>
</html>
