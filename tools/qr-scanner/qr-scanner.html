<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>QR Code Scanner | اسکنر کد QR</title>
        <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="qr-scanner.css" />
    <!-- کتابخانه html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  </head>
  <body>
    <div class="container">
        <div class="lang-switcher">
      <label for="langSelect" data-i18n="langLabel">&#1586;&#1576;&#1575;&#1606;:</label>
      <select id="langSelect">
        <option value="fa">&#1601;&#1575;&#1585;&#1587;&#1740;</option>
        <option value="en">English</option>
        <option value="zh">&#20013;&#25991;</option>
        <option value="hi">&#2361;&#2367;&#2306;&#2342;&#2368;</option>
      </select>
    </div>

    <a class="back-link" href="../../index.html" data-i18n="backHome">Back to home</a>

      <h1 id="pageTitle" data-i18n="qrScannerPageTitle">📷 QR Code Scanner</h1>
      <div class="sub" id="pageSubtitle" data-i18n="qrScannerPageSubtitle">
        اسکن کد QR با دوربین یا آپلود تصویر — کاملاً سمت کاربر
      </div>

      <div class="scanner-options">
        <button id="startCameraBtn" data-i18n="qrScannerStartCamera">📸 شروع دوربین</button>
        <button id="stopCameraBtn" style="background: #5e2a2a" data-i18n="qrScannerStopCamera">
          ⏹️ توقف دوربین
        </button>
      </div>

      <div id="reader" style="display: none"></div>

      <div class="upload-area" id="uploadArea">
        <span data-i18n="qrScannerUpload">📂 یا یک تصویر حاوی QR Code را آپلود کنید (PNG, JPG)</span>
        <input
          type="file"
          id="fileInput"
          accept="image/*"
          style="display: none"
        />
      </div>

      <div id="resultArea" class="result" style="display: none">
        <h3 data-i18n="qrScannerResultTitle">📄 نتیجه اسکن</h3>
        <pre id="qrResultText"></pre>
        <button id="copyResultBtn" class="copy-btn" data-i18n="copyTextBtn">📋 کپی متن</button>
      </div>

      <div id="statusMsg" class="status"></div>
      <footer data-i18n="privacyFooterImages">
        🔒 تمام عملیات در مرورگر شما انجام می‌شود — تصاویر به سرور ارسال
        نمی‌شوند.
      </footer>
    </div>

    <script src="../../translations.js"></script>
    <script src="../../script.js"></script>
    <script src="qr-scanner.js"></script>
</body>
</html>
