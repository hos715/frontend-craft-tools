<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Extractor | استخراج پالت رنگی از تصویر</title>
        <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="color-palette-extractor.css" />
  </head>
  <body>
    <div class="container">
        <div class="lang-switcher">
      <label for="langSelect" data-i18n="langLabel">&#1586;&#1576;&#1575;&#1606;:</label>
      <select id="langSelect">
        <option value="fa">&#1601;&#1575;&#1585;&#1587;&#1740;</option>
        <option value="en">English</option>
        <option value="zh">&#20013;&#25991;</option>
        <option value="hi">&#2361;&#2367;&#2306;&#2342;&#2368;</option>
      </select>
    </div>

    <a class="back-link" href="../../index.html" data-i18n="backHome">Back to home</a>

      <h1 id="pageTitle" data-i18n="colorPalettePageTitle">🎨 Color Palette Extractor</h1>
      <div class="sub" id="pageSubtitle" data-i18n="colorPalettePageSubtitle">
        استخراج رنگ‌های غالب از تصویر — انتخاب خروجی Hex، RGB یا HSL
      </div>

      <div class="upload-area" id="dropZone">
        <span data-i18n="colorPaletteUpload">📂 تصویر را بکشید یا کلیک کنید (PNG, JPG, WebP, ...)</span>
        <input
          type="file"
          id="fileInput"
          accept="image/*"
          style="display: none"
        />
        <div id="previewContainer"></div>
      </div>

      <div class="controls">
        <div class="left-controls">
          <label>
            <span data-i18n="colorPaletteCountLabel">🎨 تعداد رنگ‌ها:</span>
            <input type="range" id="colorCount" min="2" max="10" value="6" />
            <span id="countValue">6</span>
          </label>
          <button id="extractBtn" data-i18n="colorPaletteExtractBtn">✨ استخراج پالت</button>
        </div>
        <div class="format-switch" id="formatSwitch">
          <button data-format="hex" class="active">Hex</button>
          <button data-format="rgb">RGB</button>
          <button data-format="hsl">HSL</button>
        </div>
      </div>

      <div id="paletteContainer" class="palette"></div>

      <div class="css-output" id="cssOutput" style="display: none">
        <h3 data-i18n="colorPaletteCssTitle">📋 CSS Variables آماده (کپی کنید)</h3>
        <div style="position: relative">
          <pre id="cssVars" dir="ltr"></pre>
          <button
            id="copyCssBtn"
            class="copy-btn"
            data-i18n="copyBtn"
            style="position: absolute; top: 8px; left: 8px"
          >
            📋 کپی
          </button>
        </div>
      </div>

      <div id="statusMsg" class="status"></div>
      <footer data-i18n="privacyFooter">🔒 تمام عملیات در مرورگر شما انجام می‌شود.</footer>
    </div>

    <script src="../../translations.js"></script>
    <script src="../../script.js"></script>
    <script src="color-palette-extractor.js"></script>
</body>
</html>
