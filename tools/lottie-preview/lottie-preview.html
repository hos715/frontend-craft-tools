<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lottie Animation Preview | پیش‌نمایش انیمیشن لاتی</title>
        <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="lottie-preview.css" />
    <!-- کتابخانه lottie-web -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  </head>
  <body>
    <div class="container">
        <div class="lang-switcher">
      <label for="langSelect" data-i18n="langLabel">&#1586;&#1576;&#1575;&#1606;:</label>
      <select id="langSelect">
        <option value="fa">&#1601;&#1575;&#1585;&#1587;&#1740;</option>
        <option value="en">English</option>
        <option value="zh">&#20013;&#25991;</option>
        <option value="hi">&#2361;&#2367;&#2306;&#2342;&#2368;</option>
      </select>
    </div>

    <a class="back-link" href="../../index.html" data-i18n="backHome">Back to home</a>

      <h1 id="pageTitle" data-i18n="lottiePreviewPageTitle">🎬 Lottie Animation Preview</h1>
      <div class="sub" id="pageSubtitle" data-i18n="lottiePreviewPageSubtitle">
        پیش‌نمایش فایل‌های انیمیشن لاتی (JSON) — با کنترل پخش و سرعت
      </div>

      <div class="upload-area" id="dropZone">
        <span data-i18n="lottiePreviewUpload">📂 فایل JSON لاتی را بکشید یا کلیک کنید</span>
        <input
          type="file"
          id="fileInput"
          accept=".json,application/json"
          style="display: none"
        />
      </div>

      <div
        id="animationContainer"
        class="animation-container"
        style="display: none"
      >
        <div id="lottieCanvas" style="width: 100%; min-height: 300px"></div>
        <div class="controls">
          <button id="playBtn" data-i18n="lottiePreviewPlay">▶️ پخش</button>
          <button id="pauseBtn" data-i18n="lottiePreviewPause">⏸️ توقف</button>
          <button id="stopBtn" data-i18n="lottiePreviewStop">⏹️ ایست</button>
          <div class="speed-control">
            <span data-i18n="lottiePreviewSpeed">🐢 سرعت</span>
            <input
              type="range"
              id="speedSlider"
              min="0.1"
              max="3"
              step="0.01"
              value="1"
            />
            <span id="speedValue">1x</span>
          </div>
        </div>
      </div>

      <div id="statusMsg" class="status"></div>
      <footer>
        <span data-i18n="privacyFooterNoUpload">🔒 تمام عملیات در مرورگر شما انجام می‌شود — فایل به سرور ارسال نمی‌شود.</span><br />
        <span data-i18n="lottiePreviewFooterLib">💡 از کتابخانه lottie-web برای رندر استفاده شده است.</span>
      </footer>
    </div>

    <script src="../../translations.js"></script>
    <script src="../../script.js"></script>
    <script src="lottie-preview.js"></script>
</body>
</html>
