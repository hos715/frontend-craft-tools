name: Bug report
description: Report a problem with an existing tool
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve frontend-craft-tools!

  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - JSON Minifier
        - Lottie Color Switcher
        - Base64 Encoder / Decoder
        - Box Shadow Generator
        - Color Palette Extractor
        - CSS Gradient Generator
        - CSS Variable Extractor
        - Favicon Generator
        - Image Compressor
        - Lottie Preview
        - Markdown Previewer
        - PNG Optimizer
        - QR Generator
        - QR Scanner
        - SVG Optimizer
        - Landing page / i18n
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome 124, Firefox 125
    validations:
      required: false
